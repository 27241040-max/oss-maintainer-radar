name: Maintainer Radar

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "GitHub repository to audit, for example owner/repo."
        required: false
        default: ""
      stale_days:
        description: "Days without updates before an issue is considered stale."
        required: false
        default: "30"
      since:
        description: "Optional ISO date or datetime for release-window filtering."
        required: false
        default: ""
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: ${{ github.event.inputs.target_repo || github.repository }}
      STALE_DAYS: ${{ github.event.inputs.stale_days || '30' }}
      SINCE: ${{ github.event.inputs.since || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate maintainer reports
        uses: ./
        with:
          target_repo: ${{ env.TARGET_REPO }}
          stale_days: ${{ env.STALE_DAYS }}
          since: ${{ env.SINCE }}
          output_dir: reports
          github_token: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: maintainer-radar-report
          path: reports/
