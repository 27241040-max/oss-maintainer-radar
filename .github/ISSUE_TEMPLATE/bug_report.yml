name: Bug report
description: Report incorrect analysis, CLI failures, or misleading output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal fixture or command
      description: Share a small JSON fixture or the exact command that reproduced the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What should the report have said?
    validations:
      required: true

